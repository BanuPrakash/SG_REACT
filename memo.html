<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // HOF
        function memoize(fn) {
            var cache = {}; 
            return function(args) {
                if(cache[args]) {
                    return cache[args];
                } else {
                    let result = fn(args);
                    cache[args] = result;
                    return result;
                }   
            }
        }

        function fibanocci(no) {
            if(no == 0 || no == 1) {
                return no;
            } else {
                return fibanocci(no - 1) + fibanocci(no -2);
            }
        }

        let memFib = memoize(fibanocci);

        console.time("f");
            console.log(memFib(40));
        console.timeEnd("f");

         console.time("s");
            console.log(memFib(40));
        console.timeEnd("s");
    </script>
</body>
</html>
